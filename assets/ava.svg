    <!-- neck + face -->
    <rect x="106" y="138" width="28" height="36" rx="12" fill="#E9A786"/>
    <ellipse cx="120" cy="112" rx="40" ry="46" fill="#F2B79A"/>
    <!-- hair: a short wavy bob -->
    <path d="M78 116c-6-44 18-70 46-70 30 0 50 22 46 62-2 18-6 30-12 38 4-20 2-40-8-52-14 6-36 8-58 2-8 12-10 30-6 50-6-8-8-18-8-30z" fill="#2A1438"/>
    <path d="M96 58c16-10 44-10 58 6" fill="none" stroke="#4A2560" stroke-width="5" stroke-linecap="round"/>
    <!-- face details -->
    <ellipse cx="104" cy="114" rx="4.5" ry="5.5" fill="#1A1A3A"/>
    <ellipse cx="136" cy="114" rx="4.5" ry="5.5" fill="#1A1A3A"/>
    <path d="M96 102c4-3 10-3 14 0M130 102c4-3 10-3 14 0" fill="none" stroke="#2A1438" stroke-width="3" stroke-linecap="round"/>
    <path d="M108 134c7 6 17 6 24 0" fill="none" stroke="#B54A5A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="96" cy="126" r="6" fill="#FF7FA6" opacity=".45"/>
    <circle cx="144" cy="126" r="6" fill="#FF7FA6" opacity=".45"/>
    <!-- headset -->
    <path d="M76 112c0-30 20-52 44-52s44 22 44 52" fill="none" stroke="#0B0B2E" stroke-width="7" stroke-linecap="round"/>
    <rect x="66" y="102" width="16" height="28" rx="8" fill="#0B0B2E"/>
    <rect x="158" y="102" width="16" height="28" rx="8" fill="#0B0B2E"/>
    <path d="M74 128c0 16 10 22 26 22" fill="none" stroke="#0B0B2E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="103" cy="150" r="6" fill="#FF3D7F"/>
