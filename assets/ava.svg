<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Ava, the brightfront assistant">
  <defs>
    <linearGradient id="avaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#7A2B8F"/>
    </linearGradient>
    <clipPath id="avaClip"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>
  <g clip-path="url(#avaClip)">
    <rect width="240" height="240" fill="url(#avaBg)"/>
    <circle cx="190" cy="44" r="60" fill="#fff" opacity=".08"/>
